[project]
name = "rhizo"
version = "0.1.0"
description = "Rhizo API: service dependency graph and incident memory on FalkorDB"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.11",
  "pydantic-settings>=2.3",
  "falkordb>=1.0",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "httpx>=0.27",
  "pyjwt>=2.9",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rhizo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["falkordb", "falkordb.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
